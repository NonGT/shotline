[package]
name = "shotline-plugin-venice"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "venice"

[[bin]]
name = "shotline-plugin-venice"
path = "src/main.rs"

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde_json = "1.0.154"
shotline-plugin = { version = "0.1.0", path = "../../crates/shotline-plugin" }
tokio = { version = "1.54.1", features = ["rt", "macros", "io-std", "sync"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6.5"
