[package]
name = "shotline-plugin-filmcraft"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "filmcraft"
doctest = false

[[bin]]
name = "shotline-plugin-filmcraft"
path = "src/main.rs"
test = false

[dependencies]
async-trait = "0.1.92"
getrandom = "0.3.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
shotline-plugin = { version = "0.1.0", path = "../../crates/shotline-plugin" }
tokio = { version = "1.54.1", features = ["rt", "macros", "io-std"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
