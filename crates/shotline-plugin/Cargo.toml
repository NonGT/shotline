[package]
name = "shotline-plugin"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1.92"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
shotline-protocol = { version = "0.1.0", path = "../shotline-protocol" }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["process", "io-util", "io-std", "rt", "rt-multi-thread", "time", "macros", "sync"] }
toml = "1.1.8"

[dev-dependencies]
tempfile = "3.27.0"
