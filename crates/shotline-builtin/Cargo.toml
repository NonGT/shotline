[package]
name = "shotline-builtin"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
shotline-plugin = { version = "0.1.0", path = "../shotline-plugin" }
tokio = { version = "1.54.1", features = ["rt", "time", "macros", "sync"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6.5"
