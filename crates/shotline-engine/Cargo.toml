[package]
name = "shotline-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
jiff = "0.2.38"
serde_json = "1.0.154"
shotline-core = { version = "0.1.0", path = "../shotline-core" }
shotline-plugin = { version = "0.1.0", path = "../shotline-plugin" }
tokio = { version = "1.54.1", features = ["time", "sync", "macros"] }
toml = "1.1.8"
ulid = "3.0.0"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
