[package]
name = "shotline-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "shotline"
path = "src/main.rs"

[features]
default = ["ui"]
ui = ["dep:shotline-ui"]

[dependencies]
shotline-ui = { version = "0.1.0", path = "../shotline-ui", optional = true }
shotline-media = { version = "0.1.0", path = "../shotline-media" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde_json = "1.0.154"
shotline-builtin = { version = "0.1.0", path = "../shotline-builtin" }
shotline-core = { version = "0.1.0", path = "../shotline-core" }
shotline-engine = { version = "0.1.0", path = "../shotline-engine" }
shotline-plugin = { version = "0.1.0", path = "../shotline-plugin" }
tokio = { version = "1.54.1", features = ["io-std", "io-util", "macros", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.1.8"
rmcp = { version = "3.8.0", features = ["server", "transport-io", "macros"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
assert_cmd = "2.2.2"
assert_fs = "1.1.4"
predicates = "3.1.4"
serde_json = "1.0.154"
