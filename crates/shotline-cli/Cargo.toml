[package]
name = "shotline-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "shotline"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
shotline-core = { version = "0.1.0", path = "../shotline-core" }

[dev-dependencies]
assert_cmd = "2.2.2"
assert_fs = "1.1.4"
predicates = "3.1.4"
