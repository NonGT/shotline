# Models known without asking a plugin. Plugins describe their own models, which replace these,
# and a project can add or replace entries with its own models.toml. Kept for tests and as an
# example of the format.
# ref_image is how a reference image is named in the prompt; {n} counts from 1.

[[model]]
plugin = "fal"
id = "minimax/h3-max/reference-to-video"
op = "video.generate"
ref_image = "Image {n}"
max_images = 9
min_duration = 0.92
max_duration = 15
resolutions = ["480P", "768P", "1080P"]
aspects = ["adaptive", "21:9", "16:9", "4:3", "1:1", "3:4", "9:16"]
start_frame = true
start_frame_with_refs = true
