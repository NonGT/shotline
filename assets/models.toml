# What each model accepts. A project can add or replace entries with its own models.toml.
# ref_image is how a reference image is named in the prompt; {n} counts from 1.

[[model]]
provider = "fal"
id = "minimax/h3-max/reference-to-video"
ref_image = "Image {n}"
max_images = 9
min_duration = 0.92
max_duration = 15
resolutions = ["480P", "768P", "1080P"]
aspects = ["adaptive", "21:9", "16:9", "4:3", "1:1", "3:4", "9:16"]
start_frame = true
start_frame_with_refs = true

[[model]]
provider = "venice"
id = "minimax-h3-max-reference-to-video"
ref_image = "<Picture {n}>"
max_images = 30
min_duration = 5
max_duration = 15
whole_seconds = true
resolutions = ["480P", "768P", "1080P"]
aspects = ["adaptive", "21:9", "16:9", "4:3", "1:1", "3:4", "9:16"]
start_frame = true
# the API rejects image_url together with reference images
start_frame_with_refs = false
