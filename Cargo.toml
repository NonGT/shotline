[workspace]
resolver = "3"
members = ["crates/*", "plugins/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/NonGT/shotline"

[workspace.dependencies]
shotline-core = { path = "crates/shotline-core" }

[profile.release]
lto = "thin"
strip = true
