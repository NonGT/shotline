[workspace]
resolver = "3"
members = ["crates/*", "plugins/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/NonGT/shotline"

[workspace.dependencies]
shotline-core = { path = "crates/shotline-core" }

# Decoding a 4K anchor unoptimised takes a good part of a second.
[profile.dev.package]
image.opt-level = 3
png.opt-level = 3
zune-jpeg.opt-level = 3
zune-core.opt-level = 3
fdeflate.opt-level = 3
miniz_oxide.opt-level = 3
crc32fast.opt-level = 3
simd-adler32.opt-level = 3
# A video frame through ColorImage takes ~20 ms unoptimised, half a frame's time at 24 fps.
ecolor.opt-level = 3
epaint.opt-level = 3
emath.opt-level = 3
egui.opt-level = 3

[profile.release]
lto = "thin"
strip = true

# Thai sara am fix, see vendor/epaint/PATCH.md
[patch.crates-io]
epaint = { path = "vendor/epaint" }
